<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kizo</title>
    <style>
      :root {
        color: #181916;
        background: #f7f6f2;
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(320px, calc(100vw - 36px));
        text-align: center;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 26px;
      }
      p {
        margin: 0;
        color: #71746f;
        font-size: 14px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kizo</h1>
      <p>Connect to the internet to open the app.</p>
    </main>
  </body>
</html>
